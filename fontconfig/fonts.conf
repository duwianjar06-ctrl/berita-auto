<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Runtime route generates a config that puts the bundled Noto Sans package first. -->
  <dir prefix="relative">../node_modules/@fontsource/noto-sans/files</dir>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir>/opt/fonts</dir>
  <cachedir>/tmp/fontconfig</cachedir>
</fontconfig>
