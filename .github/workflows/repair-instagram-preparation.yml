name: Repair Instagram Preparation

on:
  push:
    branches: [feature/auto-news-mvp]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[instagram-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-news-mvp
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          def edit(path, fn):
              p = root / path
              s = p.read_text()
              n = fn(s)
              if n == s:
                  raise SystemExit(f'NO_CHANGE: {path}')
              p.write_text(n)

          (root/'lib/instagram-carousel-contract.js').write_text("export const INSTAGRAM_CAROUSEL_MAX_SLIDES=2;\nexport const INSTAGRAM_CAROUSEL_MIN_SLIDES=1;\n")

          edit('lib/social-carousel.js', lambda s: s.replace("import {socialVisualProfile,buildSocialSlides} from './social-visual.js';\nexport const INSTAGRAM_CAROUSEL_MAX_ITEMS=10;", "import {socialVisualProfile,buildSocialSlides} from './social-visual.js';\nimport {INSTAGRAM_CAROUSEL_MAX_SLIDES} from './instagram-carousel-contract.js';\nexport const INSTAGRAM_CAROUSEL_MAX_ITEMS=INSTAGRAM_CAROUSEL_MAX_SLIDES;").replace("Math.min(INSTAGRAM_CAROUSEL_MAX_ITEMS,Number(slideCount)||0)", "Math.min(INSTAGRAM_CAROUSEL_MAX_ITEMS,Number(slideCount)||0)"))

          edit('lib/social-visual.js', lambda s: s.replace("const clean=value=>", "import {INSTAGRAM_CAROUSEL_MAX_SLIDES} from './instagram-carousel-contract.js';\nconst clean=value=>", 1).replace("if(chunks.length===1)chunks=deriveSingle(chunks[0],article);return chunks.slice(0,10).map", "if(chunks.length===1&&sanitizeCardText(chunks[0]).length>=320)chunks=deriveSingle(chunks[0],article);return chunks.slice(0,INSTAGRAM_CAROUSEL_MAX_SLIDES).map"))

          edit('app/api/social-card/[articleId]/route.jsx', lambda s: s.replace("import {sanitizeCardText} from '../../../../lib/social-visual.js';", "import {sanitizeCardText} from '../../../../lib/social-visual.js';\nimport {INSTAGRAM_CAROUSEL_MAX_SLIDES} from '../../../../lib/instagram-carousel-contract.js';").replace("Math.min(2,Number(new URL(request.url).searchParams.get('slide')||1))", "Math.min(INSTAGRAM_CAROUSEL_MAX_SLIDES,Number(new URL(request.url).searchParams.get('slide')||1))"))

          def prep(s):
              s=s.replace("import {buildInstagramCaptionAsync,validateInstagramCaption,getInstagramCaptionSource,CAPTION_GENERATOR_VERSION} from './instagram-caption.js';", "import {buildInstagramCaptionAsync,validateInstagramCaption,getInstagramCaptionSource,CAPTION_GENERATOR_VERSION} from './instagram-caption.js';\nimport {INSTAGRAM_CAROUSEL_MAX_SLIDES} from './instagram-carousel-contract.js';")
              s=s.replace("export async function prepareInstagramCandidate(item,{siteUrl=process.env.SITE_URL||'https://berita-auto.vercel.app',runId=`prepare-${Date.now()}`,full=true,fetchImpl=fetch}={}){", "export async function prepareInstagramCandidate(item,{siteUrl=process.env.SITE_URL||'https://berita-auto.vercel.app',runId=`prepare-${Date.now()}`,full=true,fetchImpl=fetch,onProgress=async()=>{}}={}){const progress=async(stage,currentStage)=>{try{await onProgress({stage,currentStage})}catch{}};")
              s=s.replace("const article=item?.article||item;const articleCheck=await validateArticleForInstagram", "const article=item?.article||item;await progress('ARTICLE_VALIDATION','Memeriksa halaman berita');const articleCheck=await validateArticleForInstagram")
              s=s.replace("const image=await validateSourceImage", "await progress('IMAGE_VALIDATION','Memeriksa foto berita');const image=await validateSourceImage")
              s=s.replace("const started=Date.now();let cards;try{cards=await persistSocialCards", "const started=Date.now();await progress('CARD_RENDER','Membuat Social Card');let cards;try{await progress('CARD_PERSIST','Menyimpan Social Card');cards=await persistSocialCards")
              s=s.replace("if(!sourceUrls.length||sourceUrls.length>3)return", "if(!sourceUrls.length||sourceUrls.length>INSTAGRAM_CAROUSEL_MAX_SLIDES)return")
              s=s.replace("previewUrl=cardUrls[0]||null;try{const checked=await validateCards", "previewUrl=cardUrls[0]||null;await progress('CARD_PUBLIC_CHECK','Memeriksa Social Card publik');try{const checked=await validateCards", 1)
              s=s.replace("const fallback=image.status==='FALLBACK_USED';", "const fallback=image.status==='FALLBACK_USED';await progress('CAPTION','Membuat caption Instagram');")
              s=s.replace("return{status:cardReady?'READY':'INVALID'", "await progress(cardReady?'READY':'CAPTION',cardReady?'Siap Upload':'Menyelesaikan caption');return{status:cardReady?'READY':'INVALID'")
              return s
          edit('lib/social-preparation.js', prep)

          def progress_file(s):
              return """import {getJson,setJson} from './persistence.js';\nconst KEY='ba:social:instagram:prepare:progress';\nconst MAX_RESULTS=20;\nexport const PREPARATION_STALE_THRESHOLD_MS=30000;\nexport const PREPARATION_HEARTBEAT_INTERVAL_MS=5000;\nconst safe=v=>String(v??'').slice(0,500);\nconst isPreparing=p=>String(p?.status||'').toUpperCase()==='PREPARING'&&!p?.resumeRequired;\nexport function preparationHeartbeatFresh(progress,now=Date.now()){if(!isPreparing(progress))return false;const heartbeat=Date.parse(progress?.heartbeatAt||progress?.updatedAt||progress?.startedAt||'');return Number.isFinite(heartbeat)&&now-heartbeat<=PREPARATION_STALE_THRESHOLD_MS&&Number(progress?.expiresAt||0)>now;}\nexport async function getInstagramPreparationProgress({now=Date.now(),recoverStale=true}={}){const current=await getJson(KEY);if(recoverStale&&isPreparing(current)&&!preparationHeartbeatFresh(current,now)){const recovered={...current,status:'RESUME_REQUIRED',active:false,resumeRequired:true,staleRecoveredAt:new Date(now).toISOString(),completedAt:new Date(now).toISOString(),primaryBlocker:'PREPARATION_STALE',currentStage:'Preparation sebelumnya berhenti tanpa heartbeat; dapat dilanjutkan.',stage:'RESUME_REQUIRED',heartbeatAt:new Date(now).toISOString(),updatedAt:new Date(now).toISOString()};await setJson(KEY,recovered);return recovered;}return current;}\nexport async function setInstagramPreparationProgress(patch={}){const current=(await getJson(KEY))||{};const next={...current,...patch,updatedAt:new Date().toISOString(),heartbeatAt:patch.heartbeatAt||new Date().toISOString()};if(Array.isArray(next.candidateResults))next.candidateResults=next.candidateResults.slice(-MAX_RESULTS);await setJson(KEY,next);return next;}\nexport async function upsertInstagramPreparationCandidate(result){const current=(await getJson(KEY))||{};const rows=Array.isArray(current.candidateResults)?[...current.candidateResults]:[];const idx=rows.findIndex(x=>String(x?.index)===String(result?.index));if(idx>=0)rows[idx]={...rows[idx],...result};else rows.push(result);return setInstagramPreparationProgress({...current,candidateResults:rows.slice(-MAX_RESULTS)});}\nexport function normalizeStorageError(error){const raw=safe(error?.message||error||'storage_error');const low=raw.toLowerCase();if(low.includes('this_store_has_been_suspended')||low.includes('store_has_been_suspended'))return{code:'VERCEL_BLOB_STORE_SUSPENDED',safeMessage:'Vercel Blob store sedang suspended.'};if(low.includes('token')||low.includes('authorization'))return{code:'STORAGE_AUTH_ERROR',safeMessage:'Penyimpanan Social Card tidak dapat diautentikasi.'};return{code:'CARD_PERSIST_FAILED',safeMessage:raw};}\nexport async function finishInstagramPreparationProgress(status,extra={}){const current=(await getJson(KEY))||{};return setInstagramPreparationProgress({...current,status,active:false,completedAt:new Date().toISOString(),...extra,heartbeatAt:new Date().toISOString()});}\nexport {KEY as INSTAGRAM_PREPARATION_PROGRESS_KEY,MAX_RESULTS};\n"""
          edit('lib/instagram-preparation-progress.js', progress_file)

          def admin_live(s):
              s=s.replace("readRecentPublished,deterministicCaption", "readRecentPublished")
              s=re.sub(r"const MAX_ATTEMPTS=.*?RETRY=\[5,15,30\];", "const MAX_ATTEMPTS=Math.max(1,Math.min(45,Number(process.env.INSTAGRAM_PREPARE_ATTEMPT_BUDGET||45))),READY_TARGET=Math.max(1,Math.min(15,Number(process.env.INSTAGRAM_PREPARE_READY_TARGET||2))),BUDGET=Math.max(15000,Math.min(90000,Number(process.env.INSTAGRAM_PREPARE_EXECUTION_BUDGET_MS||75000))),CANDIDATES_PER_INVOCATION=Math.max(1,Math.min(3,Number(process.env.INSTAGRAM_PREPARE_CANDIDATES_PER_INVOCATION||2))),CANDIDATE_TIMEOUT_MS=Math.max(10000,Math.min(45000,Number(process.env.INSTAGRAM_PREPARE_CANDIDATE_TIMEOUT_MS||30000))),RETRY=[5,15,30];", s, count=1, flags=re.S)
              s=s.replace("function code(result){if(result?.articleCheck?.failureCode)return String(result.articleCheck.failureCode).toUpperCase();if(result?.cardFailureCode)return String(result.cardFailureCode).toUpperCase();if(result?.cardError)return normalizeStorageError(result.cardError).code;return String(result?.reason||'UNKNOWN').toUpperCase();}", "function code(result){if(result?.articleCheck?.failureCode)return String(result.articleCheck.failureCode).toUpperCase();if(result?.cardFailureCode)return String(result.cardFailureCode).toUpperCase();if(result?.cardError)return normalizeStorageError(result.cardError).code;const reason=String(result?.reason||'UNKNOWN').toUpperCase();if(reason==='PREPARATION_CANDIDATE_TIMEOUT')return'PREPARATION_CANDIDATE_TIMEOUT';if(reason==='CARD_SLIDE_COUNT_INVALID')return'CARD_SLIDE_COUNT_INVALID';if(reason==='CAPTION_GENERATION_FAILED')return'CAPTION_GENERATION_FAILED';if(reason==='CAPTION_EMPTY')return'CAPTION_EMPTY';return reason;}")
              s=s.replace("function human(c){return c==='VERCEL_BLOB_STORE_SUSPENDED'?'Vercel Blob store sedang suspended.':c==='CARD_UPLOAD_FAILED'?'Card Instagram gagal disimpan.':c;}", "function human(c){return c==='VERCEL_BLOB_STORE_SUSPENDED'?'Vercel Blob store sedang suspended.':c==='CARD_UPLOAD_FAILED'?'Card Instagram gagal disimpan.':c==='PREPARATION_CANDIDATE_TIMEOUT'?'Kandidat melewati batas waktu preparation.':c==='CAPTION_SOURCE_MISSING'?'Sumber artikel untuk caption tidak tersedia.':c;}")
              s=s.replace("function pool({articles,queue,existing,recent,now}){const byId=new Map(articles.map(a=>[String(a?.id),a])),existingById", "function pool({articles,queue,existing,recent,now}){const byId=new Map(articles.map(a=>[String(a?.id),a])),existingById")
              s=s.replace("const a=item.article,s=String(existingById", "const a=byId.get(String(item?.article?.id))||item.article,s=String(existingById")
              s=s.replace("await setJson(ACTIVE,{runId,trigger:'admin-manual',startedAt:new Date(started).toISOString(),expiresAt:started+120000,requestedTarget});", "await setJson(ACTIVE,{runId,trigger:'admin-manual',startedAt:new Date(started).toISOString(),expiresAt:started+120000,requestedTarget,heartbeatAt:new Date(started).toISOString()});")
              s=s.replace("currentTitle:null,currentStage:'Mencari kandidat…',candidateResults:[]", "currentTitle:null,currentStage:'Mencari kandidat…',candidateResults:[],heartbeatAt:new Date(started).toISOString(),expiresAt:started+120000,lastProgressAt:new Date(started).toISOString(),currentCandidateStartedAt:null")
              old="""if(Date.now()+15000>deadline){await setInstagramPreparationProgress({status:'PREPARING',stage:'RESUME_REQUIRED',currentStage:'Batas runtime tercapai; penyiapan dapat dilanjutkan.',attempted:rows.length,ready:rows.filter(x=>x.status==='READY').length,failed:rows.filter(x=>x.status==='FAILED').length,requestedTarget,resumeRequired:true});return{status:'PREPARING',resumeRequired:true,requestedTarget,ready:rows.filter(x=>x.status==='READY').length,failed:rows.filter(x=>x.status==='FAILED').length,attempted:rows.length,remainingTarget:Math.max(0,requestedTarget-rows.filter(x=>x.status==='READY').length)};}"""
              new="""if(i>=CANDIDATES_PER_INVOCATION||Date.now()+15000>deadline){await setInstagramPreparationProgress({status:'RESUME_REQUIRED',stage:'RESUME_REQUIRED',currentStage:'Batas invocation tercapai; penyiapan dapat dilanjutkan.',attempted:rows.length,ready:rows.filter(x=>x.status==='READY').length,failed:rows.filter(x=>x.status==='FAILED').length,requestedTarget,resumeRequired:true,heartbeatAt:new Date().toISOString(),lastProgressAt:new Date().toISOString()});return{status:'PREPARING',resumeRequired:true,requestedTarget,ready:rows.filter(x=>x.status==='READY').length,failed:rows.filter(x=>x.status==='FAILED').length,attempted:rows.length,remainingTarget:Math.max(0,requestedTarget-rows.filter(x=>x.status==='READY').length)};}"""
              s=s.replace(old,new)
              old2="""await upsertInstagramPreparationCandidate({index:i+1,articleId,title:article.title,status:'PROCESSING',articleValidation:{status:'PENDING'},imageValidation:{status:'PENDING'},cardRender:{status:'PENDING'},cardPersistence:{status:'PENDING'},cardPublicValidation:{status:'PENDING'},caption:{status:'PENDING'},finalStatus:'PROCESSING'});await setInstagramPreparationProgress({currentIndex:i+1,currentArticleId:articleId,currentTitle:article.title,currentStage:'Memeriksa halaman berita',stage:'ARTICLE_VALIDATION',attempted:i+1,requestedTarget});let result;try{await setInstagramPreparationProgress({currentStage:'Memeriksa foto',stage:'IMAGE_VALIDATION'});result=await prepareInstagramCandidate({...item,article},{siteUrl:siteUrl(),runId:`${runId}-${i+1}`,full:true});}catch(error){const n=normalizeStorageError(error);result={status:'INVALID',reason:n.code,cardError:n.safeMessage,cardFailureCode:n.code};}"""
              new2="""await upsertInstagramPreparationCandidate({index:i+1,articleId,title:article.title,status:'PROCESSING',articleValidation:{status:'PENDING'},imageValidation:{status:'PENDING'},cardRender:{status:'PENDING'},cardPersistence:{status:'PENDING'},cardPublicValidation:{status:'PENDING'},caption:{status:'PENDING'},finalStatus:'PROCESSING'});await setInstagramPreparationProgress({currentIndex:i+1,currentArticleId:articleId,currentTitle:article.title,currentStage:'Memeriksa halaman berita',stage:'ARTICLE_VALIDATION',attempted:i+1,requestedTarget,heartbeatAt:new Date().toISOString(),lastProgressAt:new Date().toISOString(),currentCandidateStartedAt:new Date(candidateStarted).toISOString()});const stageTimings={},stageSeen={name:'ARTICLE_VALIDATION',at:Date.now()};const onProgress=async({stage,currentStage})=>{const nowStage=Date.now();if(stageSeen.name)stageTimings[stageSeen.name]=(stageTimings[stageSeen.name]||0)+(nowStage-stageSeen.at);stageSeen.name=stage;stageSeen.at=nowStage;await setInstagramPreparationProgress({currentStage,stage,currentIndex:i+1,currentArticleId:articleId,currentTitle:article.title,requestedTarget,heartbeatAt:new Date(nowStage).toISOString(),lastProgressAt:new Date(nowStage).toISOString(),stageStartedAt:new Date(nowStage).toISOString()});};let result;try{result=await Promise.race([prepareInstagramCandidate({...item,article},{siteUrl:siteUrl(),runId:`${runId}-${i+1}`,full:true,onProgress}),new Promise(resolve=>setTimeout(()=>resolve({status:'INVALID',reason:'PREPARATION_CANDIDATE_TIMEOUT',failureStage:stageSeen.name,error:`candidate_timeout_${CANDIDATE_TIMEOUT_MS}ms`}),CANDIDATE_TIMEOUT_MS))]);}catch(error){const n=normalizeStorageError(error);result={status:'INVALID',reason:n.code,cardError:n.safeMessage,cardFailureCode:n.code};}const finalStageAt=Date.now();if(stageSeen.name)stageTimings[stageSeen.name]=(stageTimings[stageSeen.name]||0)+(finalStageAt-stageSeen.at);"""
              if old2 not in s: raise SystemExit('NO_CHANGE: admin live processing block')
              s=s.replace(old2,new2)
              s=s.replace("caption:deterministicCaption(article,siteUrl()),captionOriginal:deterministicCaption(article,siteUrl()),captionStatus:'READY',", "caption:result.caption||null,captionOriginal:result.captionOriginal||result.caption||null,captionBody:result.captionBody||result.caption||null,captionStatus:result.captionStatus||'INVALID',captionReady:Boolean(result.captionReady&&result.caption),captionGeneratedBy:result.captionGeneratedBy||null,captionGeneratorVersion:result.captionGeneratorVersion||null,captionAiUsed:Boolean(result.captionAiUsed),captionFallbackUsed:Boolean(result.captionFallbackUsed),captionSourceLength:Number(result.captionSourceLength||0),captionSourceField:result.captionSourceField||null,captionSourceHash:result.captionSourceHash||null,captionCoverage:result.captionCoverage||null,captionRichness:result.captionRichness||null,captionLength:Number(result.captionLength||String(result.caption||'').length),captionQualityStatus:result.captionQualityStatus||null,articleUrl:result.articleUrl||`${siteUrl()}${articlePath(article)}`,")
              s=s.replace("failureReason:ready?null:human(detail?.code||failure),failureMessage:ready?null:detail?.safeMessage||human(failure),", "failureReason:ready?null:human(detail?.code||failure),failureMessage:ready?null:detail?.safeMessage||result.error||human(failure),retryable:ready?false:['CANONICAL_URL_TIMEOUT','CANONICAL_URL_UNREACHABLE','CANONICAL_URL_5XX','CARD_PUBLIC_TIMEOUT','CARD_PUBLIC_5XX','CARD_UPLOAD_FAILED','CARD_PERSIST_FAILED','PREPARATION_CANDIDATE_TIMEOUT'].includes(failure),")
              s=s.replace("attemptCount:ready?0:1,lastAttemptAt:new Date().toISOString(),nextRetryAt:ready?null:new Date(now+retryMs(1)).toISOString(),updatedAt:new Date().toISOString(),diagnostics:{candidateMs:Date.now()-candidateStarted}};", "attemptCount:Number(item?.prior?.attemptCount||0)+(ready?0:1),lastAttemptAt:new Date().toISOString(),nextRetryAt:ready||!['CANONICAL_URL_TIMEOUT','CANONICAL_URL_UNREACHABLE','CANONICAL_URL_5XX','CARD_PUBLIC_TIMEOUT','CARD_PUBLIC_5XX','CARD_UPLOAD_FAILED','CARD_PERSIST_FAILED','PREPARATION_CANDIDATE_TIMEOUT'].includes(failure)?null:new Date(Date.now()+retryMs(Number(item?.prior?.attemptCount||0)+1)).toISOString(),updatedAt:new Date().toISOString(),diagnostics:{candidateMs:Date.now()-candidateStarted,stageDurationsMs:stageTimings}};")
              s=s.replace("if(ready&&rows.filter(x=>x.status==='READY').length>=requestedTarget)break;", "if(ready&&rows.filter(x=>x.status==='READY').length>=requestedTarget)break;")
              return s
          edit('lib/instagram-preparation-admin-live.js', admin_live)

          def route(s):
              s=s.replace("import {getInstagramAdminSnapshot,invalidateInstagramAdminSnapshot} from '../../../../../lib/instagram-admin-snapshot.js';", "import {invalidateInstagramAdminSnapshot} from '../../../../../lib/instagram-admin-snapshot.js';")
              s=s.replace("async function state(){const [snapshot,progress]=await Promise.all([getInstagramAdminSnapshot(),getInstagramPreparationProgress()]);const runs=Array.isArray(snapshot.runs)?snapshot.runs:[];const active=progress?.status==='PREPARING'&&progress?.runId?{runId:progress.runId,trigger:progress.trigger,startedAt:progress.startedAt,expiresAt:Date.parse(progress.startedAt||'')+120000,requestedTarget:progress.requestedTarget||null,resumeRequired:Boolean(progress.resumeRequired)}:null;const previous=snapshot.preparation?.lastRun||snapshot.review?.lastPreparation||null;const lastRun=previous||(!active&&progress?.completedAt?{runId:progress.runId,status:progress.status,attempted:progress.attempted||0,ready:progress.ready||0,failed:progress.failed||0,requestedTarget:progress.requestedTarget||null,primaryBlocker:progress.primaryBlocker||null,failureBreakdown:progress.failureBreakdown||{},completedAt:progress.completedAt,resumeRequired:Boolean(progress.resumeRequired)}:null);const logs=runs.filter(isPreparationRun).slice(0,10).map(run=>({runId:run.runId,trigger:run.triggerSource,status:run.status,stage:run.stage,reason:run.reason||null,durationMs:Number(run.durationMs||0),diagnostics:run.preparationDiagnostics||null,finishedAt:run.finishedAt}));return{active,lastRun,progress:progress||null,logs}}", "async function state(){const progress=await getInstagramPreparationProgress({recoverStale:true});const active=progress?.status==='PREPARING'&&progress?.runId&&!progress?.resumeRequired&&Date.parse(progress?.heartbeatAt||progress?.updatedAt||'')+30000>Date.now()&&Number(progress?.expiresAt||0)>Date.now()?{runId:progress.runId,trigger:progress.trigger,startedAt:progress.startedAt,expiresAt:progress.expiresAt,requestedTarget:progress.requestedTarget||null,resumeRequired:false}:null;const lastRun=!active&&progress?.completedAt?{runId:progress.runId,status:progress.status,attempted:progress.attempted||0,ready:progress.ready||0,failed:progress.failed||0,requestedTarget:progress.requestedTarget||null,primaryBlocker:progress.primaryBlocker||null,failureBreakdown:progress.failureBreakdown||{},completedAt:progress.completedAt,resumeRequired:Boolean(progress.resumeRequired),staleRecoveredAt:progress.staleRecoveredAt||null}:null;return{active,lastRun,progress:progress||null,logs:[]}}")
              return s
          edit('app/api/admin/instagram/prepare-now/route.js', route)

          def publisher(s):
              s=s.replace("import {buildCarouselImageUrls} from '../lib/social-carousel.js';", "import {buildCarouselImageUrls,INSTAGRAM_CAROUSEL_MAX_ITEMS} from '../lib/social-carousel.js';")
              s=s.replace("if(!urls.length||urls.length>2)throw", "if(!urls.length||urls.length>INSTAGRAM_CAROUSEL_MAX_ITEMS)throw")
              return s
          edit('worker/social-run.js', publisher)

          def ui(s):
              s=s.replace("import {useEffect,useMemo,useState} from 'react';", "import {useEffect,useMemo,useRef,useState} from 'react';")
              s=s.replace("const[prep,setPrep]=useState(null),[watch,setWatch]=useState(true),", "const[prep,setPrep]=useState(null),[watch,setWatch]=useState(true),[resumeBusy,setResumeBusy]=useState(false);const resumeLock=useRef(false);")
              old="""async function readPrep(){try{const b=await json('/api/admin/instagram/prepare-now');setPrep(b);setWatch(Boolean(b.active||b.progress?.resumeRequired));return b}catch(e){console.warn(e.message);return null}}"""
              new="""async function readPrep(){try{const b=await json('/api/admin/instagram/prepare-now');setPrep(b);setWatch(Boolean(b.active||b.progress?.resumeRequired));if(b?.progress?.resumeRequired&&Number(b.progress.ready||0)<Number(b.progress.requestedTarget||0)&&!resumeLock.current){resumeLock.current=true;setResumeBusy(true);try{const next=await json('/api/admin/instagram/prepare-now',{method:'POST',body:JSON.stringify({targetReady:Number(b.progress.requestedTarget||1)})});setPrep(next);setWatch(Boolean(next.active||next.resumeRequired||next.progress?.resumeRequired));}finally{resumeLock.current=false;setResumeBusy(false)}}return b}catch(e){console.warn(e.message);return null}}"""
              if old not in s: raise SystemExit('NO_CHANGE: live progress readPrep')
              s=s.replace(old,new)
              s=s.replace("<p><b>Tahap:</b> {label(progress.stage||progress.currentStage)}</p>", "<p><b>Tahap:</b> {label(progress.stage||progress.currentStage)}{resumeBusy?' · melanjutkan…':''}</p>")
              return s
          edit('app/admin-instagram/InstagramAdminLiveProgress.jsx', ui)

          # Extend the existing caption regression with source and contract assertions.
          test = root/'worker/instagram-preparation-resilience-regression.js'
          test.write_text("""import fs from 'node:fs';\nimport assert from 'node:assert/strict';\nimport {buildInstagramSlides} from '../lib/social-visual.js';\nimport {INSTAGRAM_CAROUSEL_MAX_ITEMS} from '../lib/social-carousel.js';\nimport {INSTAGRAM_CAROUSEL_MAX_SLIDES,PREPARATION_STALE_THRESHOLD_MS} from '../lib/instagram-carousel-contract.js';\nimport {preparationHeartbeatFresh} from '../lib/instagram-preparation-progress.js';\n\nconst prep=fs.readFileSync(new URL('../lib/social-preparation.js',import.meta.url),'utf8');\nconst admin=fs.readFileSync(new URL('../lib/instagram-preparation-admin-live.js',import.meta.url),'utf8');\nconst route=fs.readFileSync(new URL('../app/api/admin/instagram/prepare-now/route.js',import.meta.url),'utf8');\nconst cardRoute=fs.readFileSync(new URL('../app/api/social-card/[articleId]/route.jsx',import.meta.url),'utf8');\nconst publisher=fs.readFileSync(new URL('./social-run.js',import.meta.url),'utf8');\nconst ui=fs.readFileSync(new URL('../app/admin-instagram/InstagramAdminLiveProgress.jsx',import.meta.url),'utf8');\n\nassert.equal(INSTAGRAM_CAROUSEL_MAX_SLIDES,2);\nassert.equal(INSTAGRAM_CAROUSEL_MAX_ITEMS,2);\nconst short={id:'short',title:'Berita singkat',category:'Nasional',content:'Pemerintah mengumumkan kebijakan baru hari ini.',sitePublishedAt:'2026-08-25T00:00:00Z',sourceUrl:'https://example.com/a'};\nconst medium={...short,id:'medium',content:'Pemerintah mengumumkan kebijakan baru hari ini. Keputusan tersebut berlaku mulai pekan ini dan berdampak pada masyarakat.'};\nconst long={...short,id:'long',content:Array.from({length:10},(_,i)=>`Paragraf panjang ke-${i+1} menjelaskan kronologi, keputusan, respons, lokasi, waktu, dan dampak kebijakan pemerintah secara rinci.`).join('\\n\\n')};\nfor(const article of [short,medium,long]){const slides=buildInstagramSlides(article);assert.ok(slides.length>=1&&slides.length<=2);}\nassert.match(prep,/INSTAGRAM_CAROUSEL_MAX_SLIDES/);\nassert.doesNotMatch(prep,/sourceUrls\.length>3/);\nassert.match(admin,/byId\.get\(String\(item\?\.article\?\.id\)\)\|\|item\.article/);\nassert.doesNotMatch(admin,/deterministicCaption\\(/);\nassert.match(admin,/PREPARATION_CANDIDATE_TIMEOUT/);\nassert.match(admin,/stageDurationsMs/);\nassert.match(route,/getInstagramPreparationProgress\(\{recoverStale:true\}\)/);\nassert.doesNotMatch(route,/getInstagramAdminSnapshot\(/);\nassert.match(cardRoute,/INSTAGRAM_CAROUSEL_MAX_SLIDES/);\nassert.match(publisher,/INSTAGRAM_CAROUSEL_MAX_ITEMS/);\nassert.doesNotMatch(publisher,/urls\.length>2/);\nassert.match(ui,/resumeRequired/);\nconst now=Date.now();\nconst fresh={status:'PREPARING',startedAt:new Date(now-1000).toISOString(),expiresAt:now+60000,heartbeatAt:new Date(now-1000).toISOString()};\nconst stale={...fresh,heartbeatAt:new Date(now-(PREPARATION_STALE_THRESHOLD_MS+1000)).toISOString()};\nassert.equal(preparationHeartbeatFresh(fresh,now),true);\nassert.equal(preparationHeartbeatFresh(stale,now),false);\nconsole.log(JSON.stringify({status:'PASS',carouselMax:INSTAGRAM_CAROUSEL_MAX_ITEMS,shortSlides:buildInstagramSlides(short).length,longSlides:buildInstagramSlides(long).length,staleThresholdMs:PREPARATION_STALE_THRESHOLD_MS}));\n""")

          # Add the regression to npm test.
          pkg=root/'package.json'; text=pkg.read_text(); text=text.replace('node worker/instagram-caption-preparation-regression.js &&', 'node worker/instagram-caption-preparation-regression.js && node worker/instagram-preparation-resilience-regression.js &&', 1); pkg.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run regression and full tests
        run: |
          node worker/instagram-preparation-resilience-regression.js
          npm test
      - name: Commit repaired implementation and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/repair-instagram-preparation.yml
          git config user.name 'projectdaaw-bot'
          git config user.email 'projectdaaw-bot@users.noreply.github.com'
          git add app lib worker package.json .github/workflows/repair-instagram-preparation.yml
          git diff --cached --check
          git commit -m '[instagram-repair] fix bounded preparation lifecycle, carousel contract, and rich-v3 persistence'
          git push origin feature/auto-news-mvp
