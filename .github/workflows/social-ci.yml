name: Social Publishing CI
# Validates the latest production social publishing pipeline on every feature-branch push.
on:
  push:
    branches:
      - feature/auto-news-mvp
  pull_request:
    branches:
      - feature/auto-news-mvp
permissions: {}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run test:social
      - run: npm run test:article-routing
      - run: npm run test:category-balance
      - run: npm run build
