name: Instagram Social Scheduler

on:
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: auto-social
  cancel-in-progress: false

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger social publishing endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SOCIAL_URL: https://berita-auto.vercel.app/api/cron/social-publish
        run: |
          if [[ -z "$CRON_SECRET" ]]; then
            echo "CRON_SECRET is not configured; social scheduler cannot trigger publishing."
            exit 1
          fi

          set +e
          body_file=$(mktemp)
          http_status=$(curl --silent --show-error \
            --max-time 90 \
            -o "$body_file" \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "$SOCIAL_URL")
          curl_exit=$?
          set -e

          response=$(cat "$body_file")
          rm -f "$body_file"

          echo "HTTP_STATUS=${http_status}"
          echo "$response"

          if [[ "$curl_exit" -ne 0 ]]; then
            echo "curl_exit=${curl_exit}"
            exit "$curl_exit"
          fi

          if [[ "$http_status" -lt 200 || "$http_status" -ge 300 ]]; then
            exit 1
          fi
