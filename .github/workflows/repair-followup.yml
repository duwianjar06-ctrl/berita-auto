name: repair-followup
on:
  push:
    branches:
      - feature/auto-news-mvp
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-news-mvp
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply targeted source repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'missing pattern in {path}: {old[:100]}')
              p.write_text(s.replace(old,new,1))
          replace('lib/article-image.js', "import {ARTICLE_CONFIG} from './article-config.js';\nconst SITE='https://berita-auto.vercel.app'", "import {ARTICLE_CONFIG} from './article-config.js';\nimport {siteUrl} from './site-url.js';\nconst SITE=siteUrl()")
          replace('lib/instagram-caption.js', "import {generateInstagramRichParaphrase,paraphraseOverlapTooHigh} from './instagram-caption-ai.js';", "import {generateInstagramRichParaphrase,paraphraseOverlapTooHigh} from './instagram-caption-ai.js';\nimport {siteUrl as getSiteUrl} from './site-url.js';")
          replace('lib/instagram-caption.js', "process.env.SITE_URL||'https://berita-auto.vercel.app'", "process.env.SITE_URL||getSiteUrl()")
          p=Path('app/admin-berita/ArticleWorkspace.jsx'); s=p.read_text()
          s=s.replace("import {useEffect,useMemo,useState} from 'react';","import {useEffect,useMemo,useRef,useState} from 'react';",1)
          s=s.replace("[search,setSearch]=useState(''),[selected,setSelected]=useState(null),[config,setConfig]=useState(defaultConfig)","[search,setSearch]=useState(''),[selected,setSelected]=useState(null),[detailLoading,setDetailLoading]=useState(false),[detailError,setDetailError]=useState(null),[config,setConfig]=useState(defaultConfig)",1)
          s=s.replace("const runAction=async(action)=>","const detailRequest=useRef(0);const openDetail=async(article)=>{const requestId=++detailRequest.current;setSelected(null);setDetailError(null);setDetailLoading(true);try{const r=await fetch(`/api/admin-berita/articles/${encodeURIComponent(article.id)}`,{cache:'no-store'});const data=await r.json().catch(()=>({}));if(requestId!==detailRequest.current)return;if(!r.ok||!data?.article)throw new Error(data?.error||'article_detail_failed');setSelected(data.article)}catch(error){if(requestId===detailRequest.current)setDetailError(String(error?.message||'article_detail_failed'))}finally{if(requestId===detailRequest.current)setDetailLoading(false)}};const runAction=async(action)=>",1)
          s=s.replace("onDetail={()=>setSelected(a)}","onDetail={()=>openDetail(a)}",1)
          s=s.replace("{selected&&<ArticleDetail article={selected} onClose={()=>setSelected(null)}", "{detailLoading&&<div className=\"article-modal-backdrop\"><aside className=\"article-modal article-detail-modal\"><button className=\"article-detail-close\" onClick={()=>{detailRequest.current++;setDetailLoading(false)}}>Tutup</button><p className=\"admin-label\">ARTICLE DETAIL</p><h2>Memuat detail artikel…</h2></aside></div>}{detailError&&<div className=\"article-modal-backdrop\"><aside className=\"article-modal article-detail-modal\"><button className=\"article-detail-close\" onClick={()=>setDetailError(null)}>Tutup</button><p className=\"admin-label\">ARTICLE DETAIL</p><h2>Detail gagal dimuat</h2><p>{detailError}</p></aside></div>}{selected&&<ArticleDetail article={selected} onClose={()=>{detailRequest.current++;setSelected(null)}}",1)
          if s==p.read_text(): raise SystemExit('ArticleWorkspace patterns produced no changes')
          p.write_text(s)
          for path in ['lib/social-preparation.js','lib/social.js','lib/social-carousel.js','lib/article-admin-metrics.js','app/page.jsx','app/home/page.jsx']:
              p=Path(path)
              if p.exists():
                  s=p.read_text(); n=s.replace('https://berita-auto.vercel.app','https://berita-auto-olive.vercel.app')
                  if n!=s:p.write_text(n)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/article-image.js lib/instagram-caption.js app/admin-berita/ArticleWorkspace.jsx lib/social-preparation.js lib/social.js lib/social-carousel.js lib/article-admin-metrics.js app/page.jsx app/home/page.jsx
          git commit -m 'fix: finish article lazy loading and migrated site URLs'
          git push origin feature/auto-news-mvp
