name: repair-followup
on:
  push:
    branches: [feature/auto-news-mvp]
jobs:
  repair:
    if: github.event.head_commit.message != 'chore: remove temporary repair workflow'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-news-mvp
          fetch-depth: 1
      - name: Apply targeted repairs
        shell: python
        run: |
          from pathlib import Path
          def edit(path, replacements):
              p=Path(path); s=p.read_text()
              original=s
              for old,new in replacements:
                  if old not in s:
                      raise SystemExit(f'pattern not found: {path}: {old[:120]}')
                  s=s.replace(old,new,1)
              p.write_text(s)
              print(path, 'changed' if s!=original else 'unchanged')

          edit('lib/article-image.js', [
            ("import {ARTICLE_CONFIG} from './article-config.js';\nconst SITE='https://berita-auto.vercel.app'", "import {ARTICLE_CONFIG} from './article-config.js';\nimport {siteUrl} from './site-url.js';\nconst SITE=siteUrl()")
          ])
          edit('lib/instagram-caption.js', [
            ("import {generateInstagramRichParaphrase,paraphraseOverlapTooHigh} from './instagram-caption-ai.js';", "import {generateInstagramRichParaphrase,paraphraseOverlapTooHigh} from './instagram-caption-ai.js';\nimport {siteUrl} from './site-url.js';"),
            ("String(siteUrl||process.env.SITE_URL||'https://berita-auto.vercel.app')", "String(siteUrl||siteUrl())")
          ])
          edit('app/admin-berita/ArticleWorkspace.jsx', [
            ("import {useEffect,useMemo,useState} from 'react';", "import {useEffect,useMemo,useRef,useState} from 'react';"),
            ("[search,setSearch]=useState(''),[selected,setSelected]=useState(null),[config,setConfig]=useState(defaultConfig)", "[search,setSearch]=useState(''),[selected,setSelected]=useState(null),[detailLoading,setDetailLoading]=useState(false),[detailError,setDetailError]=useState(null),[config,setConfig]=useState(defaultConfig)"),
            ("const runAction=async(action)=>", "const openDetail=async(article)=>{const requestId=++detailRequest.current;setSelected(null);setDetailError(null);setDetailLoading(true);try{const r=await fetch(`/api/admin-berita/articles/${encodeURIComponent(article.id)}`,{cache:'no-store'});const data=await r.json().catch(()=>({}));if(requestId!==detailRequest.current)return;if(!r.ok||!data?.article)throw new Error(data?.error||'article_detail_failed');setSelected(data.article)}catch(error){if(requestId===detailRequest.current)setDetailError(String(error?.message||'article_detail_failed'))}finally{if(requestId===detailRequest.current)setDetailLoading(false)}};const detailRequest=useRef(0);const runAction=async(action)=>"),
            ("onDetail={()=>setSelected(a)}", "onDetail={()=>openDetail(a)}"),
            ("{selected&&<ArticleDetail article={selected} onClose={()=>setSelected(null)}", "{detailLoading&&<div className=\"article-modal-backdrop\"><aside className=\"article-modal article-detail-modal\"><button className=\"article-detail-close\" onClick={()=>{detailRequest.current++;setDetailLoading(false)}}>Tutup</button><p className=\"admin-label\">ARTICLE DETAIL</p><h2>Memuat detail artikel…</h2></aside></div>}{detailError&&<div className=\"article-modal-backdrop\"><aside className=\"article-modal article-detail-modal\"><button className=\"article-detail-close\" onClick={()=>setDetailError(null)}>Tutup</button><p className=\"admin-label\">ARTICLE DETAIL</p><h2>Detail gagal dimuat</h2><p>{detailError}</p></aside></div>}{selected&&<ArticleDetail article={selected} onClose={()=>{detailRequest.current++;setSelected(null)}}"),
            ("function Health({label,value,dot})", "function storageLabel(v){if(v?.healthy)return'Healthy';if(v?.code==='blob_token_missing')return'Token Missing';if(v?.code==='STORE_SUSPENDED')return'Store Suspended';if(v?.code&&/auth|token|credential/i.test(v.code))return'Auth Error';return'Unavailable'}\nfunction Health({label,value,dot})"),
            ("<Health label=\"IMAGE FAILED\" value={failed}/>", "<Health label=\"IMAGE FAILED\" value={failed}/><Health label=\"IMAGE STORAGE\" value={storageLabel(health?.storageHealth)}/>")
          ])

          # Replace only known runtime legacy host literals; migration/tests/docs are left untouched.
          for path in ['lib/social-preparation.js','lib/social.js','lib/social-carousel.js','lib/article-admin-metrics.js','app/page.jsx','app/home/page.jsx']:
              p=Path(path)
              if p.exists():
                  s=p.read_text()
                  n=s.replace('https://berita-auto.vercel.app','https://berita-auto-olive.vercel.app')
                  if n!=s:p.write_text(n);print(path,'legacy host repaired')

      - name: Commit targeted repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/article-image.js lib/instagram-caption.js app/admin-berita/ArticleWorkspace.jsx lib/social-preparation.js lib/social.js lib/social-carousel.js lib/article-admin-metrics.js app/page.jsx app/home/page.jsx
          git diff --cached --check
          git commit -m 'fix: finish article lazy loading and migrated site URLs'
          git push origin feature/auto-news-mvp

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/repair-followup.yml
          git commit -m 'chore: remove temporary repair workflow'
          git push origin feature/auto-news-mvp
