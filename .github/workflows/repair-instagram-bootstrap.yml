name: Repair Instagram Bootstrap

on:
  push:
    branches: [feature/auto-news-mvp]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[instagram-bootstrap]') && !contains(github.event.head_commit.message, '[instagram-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-news-mvp
          fetch-depth: 0
      - name: Patch repair workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/repair-instagram-preparation.yml')
          s=p.read_text()
          s=s.replace("import {INSTAGRAM_CAROUSEL_MAX_SLIDES,PREPARATION_STALE_THRESHOLD_MS} from '../lib/instagram-carousel-contract.js';", "import {INSTAGRAM_CAROUSEL_MAX_SLIDES} from '../lib/instagram-carousel-contract.js';\nimport {PREPARATION_STALE_THRESHOLD_MS} from '../lib/instagram-preparation-progress.js';")
          p.write_text(s)
          Path('.github/workflows/repair-instagram-bootstrap.yml').unlink()
          PY
          git config user.name 'projectdaaw-bot'
          git config user.email 'projectdaaw-bot@users.noreply.github.com'
          git add .github/workflows
          git diff --cached --check
          git commit -m '[instagram-bootstrap] fix repair regression import'
          git push origin feature/auto-news-mvp
