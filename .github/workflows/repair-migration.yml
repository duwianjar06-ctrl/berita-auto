name: repair-migration

on:
  push:
    branches:
      - feature/auto-news-mvp

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-news-mvp
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply targeted source repair
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          old='https://berita-auto.vercel.app'
          new='https://berita-auto-olive.vercel.app'
          roots=[Path('app'),Path('components'),Path('lib'),Path('worker'),Path('scripts'),Path('auth.js'),Path('.env.example')]
          files=[]
          for root in roots:
              if root.is_file(): files.append(root)
              elif root.exists(): files.extend(p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.jsx','.mjs','.ts','.tsx','.json','.example'})
          for p in files:
              try: s=p.read_text()
              except UnicodeDecodeError: continue
              if old in s:
                  p.write_text(s.replace(old,new))
          PY

          cat > lib/admin-article-projection.js <<'EOF'
          const text=value=>String(value??'');
          const num=value=>Number.isFinite(Number(value))?Number(value):null;
          export function toAdminArticleListItem(article={}){
            const qualityScore=num(article?.articleQuality?.qualityScore);
            return {
              id:article.id??null,
              fingerprint:article.fingerprint??null,
              slug:article.slug??null,
              title:article.title??'',
              status:article.status??null,
              articleType:article.articleType??null,
              category:article.category??null,
              primaryQuery:article.primaryQuery??null,
              createdAt:article.createdAt??null,
              updatedAt:article.updatedAt??null,
              searchScore:num(article.searchScore),
              articleQuality:{qualityScore},
              sourceCount:Array.isArray(article.sources)?article.sources.length:num(article.sourceCount)||0,
              imageUrl:article.imageUrl??null,
              imageAlt:article.imageAlt??null,
              imageStatus:article.imageStatus??null,
              imageSource:article.imageSource??null,
              imageSourceType:article.imageSourceType??null,
              imageSourceProvider:article.imageSourceProvider??null,
              imageProvider:article.imageProvider??null,
              imageModel:article.imageModel??null,
              imageErrorCode:article.imageErrorCode??null,
              lastImageAttemptStatus:article.lastImageAttemptStatus??null,
              lastImageErrorCode:article.lastImageErrorCode??null,
              reviewReason:article.reviewReason??null,
              reviewReasons:Array.isArray(article.reviewReasons)?article.reviewReasons:[],
            };
          }
          EOF

          python3 <<'PY'
          from pathlib import Path
          p=Path('app/admin-berita/page.jsx')
          s=p.read_text()
          if "../../lib/admin-article-projection.js" not in s:
              s=s.replace("import {listAllArticles} from '../../lib/article-storage.js';", "import {listAllArticles} from '../../lib/article-storage.js';\nimport {toAdminArticleListItem} from '../../lib/admin-article-projection.js';")
          old="const articleItems=await listAllArticles();return <div className=\"admin-workspace-shell\">"
          new="const articleItems=(await listAllArticles()).map(toAdminArticleListItem);return <div className=\"admin-workspace-shell\">"
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('app/api/admin-berita/articles/route.js')
          s=p.read_text()
          if "../../../../lib/admin-article-projection.js" not in s:
              s=s.replace("import {getArticleViewCounts,sitemapStatus} from '../../../../lib/article-admin-metrics.js';", "import {getArticleViewCounts,sitemapStatus} from '../../../../lib/article-admin-metrics.js';\nimport {toAdminArticleListItem} from '../../../../lib/admin-article-projection.js';")
          old="const enriched=articles.map(article=>{const sitemap=sitemapStatus(article);if(sitemap.included)console.log('[SITEMAP_INCLUDED]',JSON.stringify({articleId:article.id,url:sitemap.url}));else console.log('[SITEMAP_SKIPPED]',JSON.stringify({articleId:article.id,reason:sitemap.reason}));return{...article,totalViews:viewCounts.get(article.id)||0,views:viewCounts.get(article.id)||0,sitemapIncluded:sitemap.included,sitemapUrl:sitemap.url,lastSitemapCheckAt:sitemap.lastSitemapCheckAt,sitemapReason:sitemap.reason}});return Response.json({articles:enriched})"
          new="let sitemapIncludedCount=0;let sitemapSkippedCount=0;const enriched=articles.map(article=>{const sitemap=sitemapStatus(article);if(sitemap.included)sitemapIncludedCount+=1;else sitemapSkippedCount+=1;return{...toAdminArticleListItem(article),totalViews:viewCounts.get(article.id)||0,views:viewCounts.get(article.id)||0,sitemapIncluded:sitemap.included,sitemapUrl:sitemap.url,lastSitemapCheckAt:sitemap.lastSitemapCheckAt,sitemapReason:sitemap.reason}});return Response.json({articles:enriched,meta:{articleCount:enriched.length,sitemapIncludedCount,sitemapSkippedCount}})"
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('app/admin-berita/ArticleWorkspace.jsx')
          s=p.read_text()
          old="onDetail={()=>setSelected(a)}"
          new="onDetail={async()=>{try{const r=await fetch(`/api/admin-berita/articles/${encodeURIComponent(a.id)}`,{cache:'no-store'});const d=await r.json().catch(()=>({}));setSelected(r.ok&&d?.article?d.article:a)}catch{setSelected(a)}}}"
          s=s.replace(old,new)
          p.write_text(s)
          PY

          mkdir -p 'app/api/admin-berita/articles/[id]'
          cat > 'app/api/admin-berita/articles/[id]/route.js' <<'EOF'
          import {auth} from '../../../../../auth.js';
          import {listAllArticles} from '../../../../../lib/article-storage.js';
          export const dynamic='force-dynamic';
          async function guard(){const session=await auth().catch(()=>null);const allowed=(process.env.ADMIN_EMAILS||'').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);const email=session?.user?.email?.trim().toLowerCase();return Boolean(email&&allowed.includes(email));}
          export async function GET(_request,{params}){if(!await guard())return Response.json({error:'unauthorized'},{status:401});const id=String((await params)?.id||'');if(!id)return Response.json({error:'article_id_required'},{status:400});const articles=await listAllArticles();const article=articles.find(item=>String(item?.id)===id);return article?Response.json({article}):Response.json({error:'article_not_found'},{status:404});}
          EOF

          # The canonical production fallback is now the new alias; keep one explicit env example.
          sed -i 's#SITE_URL=.*#SITE_URL=https://berita-auto-olive.vercel.app#' .env.example || true

          git diff --check
          git status --short
      - name: Install dependencies
        run: npm ci
      - name: Run relevant regression tests
        run: npm run test:article && npm run test:social
      - name: Build
        run: npm run build
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: repair migrated URLs images and admin article performance'
          git push origin feature/auto-news-mvp
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-migration.yml
          git commit -m 'chore: remove temporary repair workflow'
          git push origin feature/auto-news-mvp
