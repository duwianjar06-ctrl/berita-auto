name: Feature News Scheduler

# GitHub remains a fallback/watchdog trigger. Publication is executed by the shared API cycle.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: auto-news
  cancel-in-progress: false

jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger publication endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PUBLICATION_URL: https://berita-auto.vercel.app/api/cron/news-publish
        run: |
          if [[ -z "$CRON_SECRET" ]]; then
            echo "CRON_SECRET is not configured; fallback cannot trigger publication."
            exit 1
          fi

          response=$(curl --fail-with-body --silent --show-error \
            --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "$PUBLICATION_URL")

          echo "$response"
