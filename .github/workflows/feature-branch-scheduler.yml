name: Feature News Scheduler

# Production schedule lives on default branch and executes the feature branch.
# This workflow also rebuilds the application after scheduler configuration changes.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/feature-branch-scheduler.yml"

permissions:
  contents: write

concurrency:
  group: auto-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/auto-news-mvp
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Generate articles
        run: npm run news:run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit generated articles
        run: |
          git add data/articles.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update auto news"
          fi

      - name: Push generated articles
        run: git push origin HEAD:feature/auto-news-mvp
