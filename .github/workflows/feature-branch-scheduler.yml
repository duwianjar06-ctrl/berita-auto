name: Feature News Scheduler

# Production schedule lives on default branch and executes the application branch.
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-news
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout application branch
        uses: actions/checkout@v4
        with:
          ref: feature/auto-news-mvp
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Generate and publish one article
        run: npm run news:run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit queue and published data
        run: |
          git add data/articles.json data/pending-articles.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update queued auto news"
          fi

      - name: Rebase on latest feature branch
        run: |
          git fetch origin feature/auto-news-mvp
          git rebase origin/feature/auto-news-mvp

      - name: Push application data
        run: git push origin HEAD:feature/auto-news-mvp
