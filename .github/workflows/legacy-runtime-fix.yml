name: Legacy Runtime Fix
on:
  push:
    branches: [feature/auto-news-mvp]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix exact Instagram runtime fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/instagram-review.js')
          s=p.read_text()
          old="https://berita-auto.vercel.app"
          target="process.env.SITE_URL||'https://berita-auto-olive.vercel.app'"
          needle="process.env.SITE_URL||'"+old+"'"
          if needle in s:
              p.write_text(s.replace(needle,target))
          PY
      - name: Verify no legacy runtime fallback remains in Instagram review
        run: |
          ! grep -Fq "process.env.SITE_URL||'https://berita-auto.vercel.app'" lib/instagram-review.js
      - name: Commit and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/legacy-runtime-fix.yml
          git add lib/instagram-review.js .github/workflows/legacy-runtime-fix.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: remove legacy Instagram runtime domain"
          git push origin HEAD:feature/auto-news-mvp
