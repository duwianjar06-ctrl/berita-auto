name: Feature Branch CI

on:
  push:
    branches:
      - feature/auto-news-mvp
  pull_request:
    branches:
      - feature/auto-news-mvp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:search-intent
      - run: npm run test:admin-ui
      - run: npm run test:admin-notes
      - run: npm run test:admin-instagram-server
      - run: npm run test:redis-read-amplification
      - run: npm run build
