name: Feature Branch CI

on:
  push:
    branches:
      - feature/auto-news-mvp
  pull_request:
    branches:
      - feature/auto-news-mvp

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
