name: Instagram Preparation Repair
on:
  push:
    branches: [feature/auto-news-mvp]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[instagram-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-news-mvp
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply bounded preparation repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          def edit(path,fn):
            p=root/path;s=p.read_text();n=fn(s)
            if n==s: raise SystemExit('NO_CHANGE '+path)
            p.write_text(n)
          (root/'lib/instagram-carousel-contract.js').write_text("export const INSTAGRAM_CAROUSEL_MAX_SLIDES=2;\nexport const INSTAGRAM_CAROUSEL_MIN_SLIDES=1;\n")
          edit('lib/social-carousel.js',lambda s:s.replace("import {socialVisualProfile,buildSocialSlides} from './social-visual.js';\nexport const INSTAGRAM_CAROUSEL_MAX_ITEMS=10;","import {socialVisualProfile,buildSocialSlides} from './social-visual.js';\nimport {INSTAGRAM_CAROUSEL_MAX_SLIDES} from './instagram-carousel-contract.js';\nexport const INSTAGRAM_CAROUSEL_MAX_ITEMS=INSTAGRAM_CAROUSEL_MAX_SLIDES;"))
          edit('lib/social-visual.js',lambda s:s.replace("const clean=value=>","import {INSTAGRAM_CAROUSEL_MAX_SLIDES} from './instagram-carousel-contract.js';\nconst clean=value=>",1).replace("if(chunks.length===1)chunks=deriveSingle(paragraphs[0],article)}else for(const p of paragraphs){chunks.push(...splitParagraph(p));if(chunks.length>=10)break}if(chunks.length===1)chunks=deriveSingle(chunks[0],article);return chunks.slice(0,10).map","if(chunks.length===1&&sanitizeCardText(chunks[0]).length>=320)chunks=deriveSingle(paragraphs[0],article)}else for(const p of paragraphs){chunks.push(...splitParagraph(p));if(chunks.length>=INSTAGRAM_CAROUSEL_MAX_SLIDES)break}if(chunks.length===1)return chunks.slice(0,INSTAGRAM_CAROUSEL_MAX_SLIDES).map((summary,i)=>({title,summary:trim(summary,520),number:i+1,role:'cover',paragraphIndex:i}));return chunks.slice(0,INSTAGRAM_CAROUSEL_MAX_SLIDES).map"))
          edit('app/api/social-card/[articleId]/route.jsx',lambda s:s.replace("import {sanitizeCardText} from '../../../../lib/social-visual.js';","import {sanitizeCardText} from '../../../../lib/social-visual.js';\nimport {INSTAGRAM_CAROUSEL_MAX_SLIDES} from '../../../../lib/instagram-carousel-contract.js';").replace("Math.min(2,Number(new URL(request.url).searchParams.get('slide')||1))","Math.min(INSTAGRAM_CAROUSEL_MAX_SLIDES,Number(new URL(request.url).searchParams.get('slide')||1))"))
          def prep(s):
            s=s.replace("import {buildInstagramCaptionAsync,validateInstagramCaption,getInstagramCaptionSource,CAPTION_GENERATOR_VERSION} from './instagram-caption.js';","import {buildInstagramCaptionAsync,validateInstagramCaption,getInstagramCaptionSource,CAPTION_GENERATOR_VERSION} from './instagram-caption.js';\nimport {INSTAGRAM_CAROUSEL_MAX_SLIDES} from './instagram-carousel-contract.js';")
            s=s.replace("export async function prepareInstagramCandidate(item,{siteUrl=process.env.SITE_URL||'https://berita-auto.vercel.app',runId=`prepare-${Date.now()}`,full=true,fetchImpl=fetch}={}){const article=item?.article||item;","export async function prepareInstagramCandidate(item,{siteUrl=process.env.SITE_URL||'https://berita-auto.vercel.app',runId=`prepare-${Date.now()}`,full=true,fetchImpl=fetch,onProgress=async()=>{}}={}){const progress=async(stage,currentStage)=>{try{await onProgress({stage,currentStage})}catch{}};const article=item?.article||item;await progress('ARTICLE_VALIDATION','Memeriksa halaman berita');")
            s=s.replace("const image=await validateSourceImage","await progress('IMAGE_VALIDATION','Memeriksa foto berita');const image=await validateSourceImage")
            s=s.replace("if(!cardReady&&full){const slides=buildSocialSlides(article);const sourceUrls=buildCarouselImageUrls(siteUrl,article.id,slides.length);if(!sourceUrls.length||sourceUrls.length>3)","if(!cardReady&&full){const slides=buildSocialSlides(article).slice(0,INSTAGRAM_CAROUSEL_MAX_SLIDES);const sourceUrls=buildCarouselImageUrls(siteUrl,article.id,slides.length);if(!sourceUrls.length||sourceUrls.length>INSTAGRAM_CAROUSEL_MAX_SLIDES)")
            s=s.replace("const started=Date.now();let cards;try{cards=await persistSocialCards","const started=Date.now();await progress('CARD_RENDER','Membuat Social Card');let cards;try{await progress('CARD_PERSIST','Menyimpan Social Card');cards=await persistSocialCards")
            s=s.replace("previewUrl=cardUrls[0]||null;try{const checked=await validateCards","previewUrl=cardUrls[0]||null;await progress('CARD_PUBLIC_CHECK','Memeriksa Social Card publik');try{const checked=await validateCards",1)
            s=s.replace("const fallback=image.status==='FALLBACK_USED';","const fallback=image.status==='FALLBACK_USED';await progress('CAPTION','Membuat caption Instagram');")
            s=s.replace("return{status:cardReady?'READY'","await progress(cardReady?'READY':'CAPTION','Siap Upload');return{status:cardReady?'READY'")
            return s
          edit('lib/social-preparation.js',prep)
          def admin(s):
            s=s.replace("readRecentPublished,deterministicCaption","readRecentPublished")
            s=re.sub(r"const MAX_ATTEMPTS=.*?RETRY=\[5,15,30\];","const MAX_ATTEMPTS=Math.max(1,Math.min(45,Number(process.env.INSTAGRAM_PREPARE_ATTEMPT_BUDGET||45))),READY_TARGET=Math.max(1,Math.min(15,Number(process.env.INSTAGRAM_PREPARE_READY_TARGET||2))),BUDGET=Math.max(15000,Math.min(90000,Number(process.env.INSTAGRAM_PREPARE_EXECUTION_BUDGET_MS||75000))),CANDIDATES_PER_INVOCATION=Math.max(1,Math.min(3,Number(process.env.INSTAGRAM_PREPARE_CANDIDATES_PER_INVOCATION||2))),CANDIDATE_TIMEOUT_MS=Math.max(10000,Math.min(45000,Number(process.env.INSTAGRAM_PREPARE_CANDIDATE_TIMEOUT_MS||30000))),RETRY=[5,15,30];",s,count=1,flags=re.S)
            s=s.replace("const a=item.article,s=String(existingById","const a=byId.get(String(item?.article?.id))||item.article,s=String(existingById")
            s=s.replace("await setJson(ACTIVE,{runId,trigger:'admin-manual',startedAt:new Date(started).toISOString(),expiresAt:started+120000,requestedTarget});","await setJson(ACTIVE,{runId,trigger:'admin-manual',startedAt:new Date(started).toISOString(),expiresAt:started+120000,requestedTarget,heartbeatAt:new Date(started).toISOString()});")
            s=s.replace("currentTitle:null,currentStage:'Mencari kandidat…',candidateResults:[]","currentTitle:null,currentStage:'Mencari kandidat…',candidateResults:[],heartbeatAt:new Date(started).toISOString(),expiresAt:started+120000,lastProgressAt:new Date(started).toISOString(),currentCandidateStartedAt:null")
            s=s.replace("if(Date.now()+15000>deadline)","if(i>=CANDIDATES_PER_INVOCATION||Date.now()+15000>deadline)")
            old="await upsertInstagramPreparationCandidate({index:i+1,articleId,title:article.title,status:'PROCESSING',articleValidation:{status:'PENDING'},imageValidation:{status:'PENDING'},cardRender:{status:'PENDING'},cardPersistence:{status:'PENDING'},cardPublicValidation:{status:'PENDING'},caption:{status:'PENDING'},finalStatus:'PROCESSING'});await setInstagramPreparationProgress({currentIndex:i+1,currentArticleId:articleId,currentTitle:article.title,currentStage:'Memeriksa halaman berita',stage:'ARTICLE_VALIDATION',attempted:i+1,requestedTarget});let result;try{await setInstagramPreparationProgress({currentStage:'Memeriksa foto',stage:'IMAGE_VALIDATION'});result=await prepareInstagramCandidate({...item,article},{siteUrl:siteUrl(),runId:`${runId}-${i+1}`,full:true});}catch(error){const n=normalizeStorageError(error);result={status:'INVALID',reason:n.code,cardError:n.safeMessage,cardFailureCode:n.code};}"
            new="await upsertInstagramPreparationCandidate({index:i+1,articleId,title:article.title,status:'PROCESSING',articleValidation:{status:'PENDING'},imageValidation:{status:'PENDING'},cardRender:{status:'PENDING'},cardPersistence:{status:'PENDING'},cardPublicValidation:{status:'PENDING'},caption:{status:'PENDING'},finalStatus:'PROCESSING'});const candidateStarted=Date.now();await setInstagramPreparationProgress({currentIndex:i+1,currentArticleId:articleId,currentTitle:article.title,currentStage:'Memeriksa halaman berita',stage:'ARTICLE_VALIDATION',attempted:i+1,requestedTarget,heartbeatAt:new Date().toISOString(),lastProgressAt:new Date().toISOString(),currentCandidateStartedAt:new Date(candidateStarted).toISOString()});const stageTimings={};let lastStage={name:'ARTICLE_VALIDATION',at:Date.now()};const onProgress=async({stage,currentStage})=>{const nowStage=Date.now();stageTimings[lastStage.name]=(stageTimings[lastStage.name]||0)+(nowStage-lastStage.at);lastStage={name:stage,at:nowStage};await setInstagramPreparationProgress({currentStage,stage,currentIndex:i+1,currentArticleId:articleId,currentTitle:article.title,requestedTarget,heartbeatAt:new Date(nowStage).toISOString(),lastProgressAt:new Date(nowStage).toISOString(),stageStartedAt:new Date(nowStage).toISOString()});};let result;try{result=await Promise.race([prepareInstagramCandidate({...item,article},{siteUrl:siteUrl(),runId:`${runId}-${i+1}`,full:true,onProgress}),new Promise(resolve=>setTimeout(()=>resolve({status:'INVALID',reason:'PREPARATION_CANDIDATE_TIMEOUT',failureStage:lastStage.name,error:`candidate_timeout_${CANDIDATE_TIMEOUT_MS}ms`}),CANDIDATE_TIMEOUT_MS))]);}catch(error){const n=normalizeStorageError(error);result={status:'INVALID',reason:n.code,cardError:n.safeMessage,cardFailureCode:n.code};}stageTimings[lastStage.name]=(stageTimings[lastStage.name]||0)+(Date.now()-lastStage.at);"
            if old not in s: raise SystemExit('admin processing block not found')
            s=s.replace(old,new)
            s=s.replace("caption:deterministicCaption(article,siteUrl()),captionOriginal:deterministicCaption(article,siteUrl()),captionStatus:'READY',","caption:result.caption||null,captionOriginal:result.captionOriginal||result.caption||null,captionBody:result.captionBody||result.caption||null,captionStatus:result.captionStatus||'INVALID',captionReady:Boolean(result.captionReady&&result.caption),captionGeneratedBy:result.captionGeneratedBy||null,captionGeneratorVersion:result.captionGeneratorVersion||null,captionAiUsed:Boolean(result.captionAiUsed),captionFallbackUsed:Boolean(result.captionFallbackUsed),captionSourceLength:Number(result.captionSourceLength||0),captionSourceField:result.captionSourceField||null,captionSourceHash:result.captionSourceHash||null,captionCoverage:result.captionCoverage||null,captionRichness:result.captionRichness||null,captionLength:Number(result.captionLength||String(result.caption||'').length),articleUrl:result.articleUrl||null,")
            s=s.replace("diagnostics:{candidateMs:Date.now()-candidateStarted}","diagnostics:{candidateMs:Date.now()-candidateStarted,stageDurationsMs:stageTimings}")
            return s
          edit('lib/instagram-preparation-admin-live.js',admin)
          def progress(s):
            return """import {getJson,setJson} from './persistence.js';\nconst KEY='ba:social:instagram:prepare:progress';\nconst MAX_RESULTS=20;\nexport const PREPARATION_STALE_THRESHOLD_MS=30000;\nexport function preparationHeartbeatFresh(progress,now=Date.now()){if(String(progress?.status||'').toUpperCase()!=='PREPARING'||progress?.resumeRequired)return false;const hb=Date.parse(progress?.heartbeatAt||progress?.updatedAt||progress?.startedAt||'');return Number.isFinite(hb)&&now-hb<=PREPARATION_STALE_THRESHOLD_MS&&Number(progress?.expiresAt||0)>now;}\nexport async function getInstagramPreparationProgress({now=Date.now(),recoverStale=true}={}){const current=await getJson(KEY);if(recoverStale&&String(current?.status||'').toUpperCase()==='PREPARING'&&!preparationHeartbeatFresh(current,now)){const recovered={...current,status:'RESUME_REQUIRED',active:false,resumeRequired:true,staleRecoveredAt:new Date(now).toISOString(),completedAt:new Date(now).toISOString(),primaryBlocker:'PREPARATION_STALE',currentStage:'Preparation sebelumnya berhenti tanpa heartbeat; dapat dilanjutkan.',stage:'RESUME_REQUIRED',heartbeatAt:new Date(now).toISOString(),updatedAt:new Date(now).toISOString()};await setJson(KEY,recovered);return recovered;}return current;}\nexport async function setInstagramPreparationProgress(patch={}){const current=(await getJson(KEY))||{};const next={...current,...patch,updatedAt:new Date().toISOString(),heartbeatAt:patch.heartbeatAt||new Date().toISOString()};if(Array.isArray(next.candidateResults))next.candidateResults=next.candidateResults.slice(-MAX_RESULTS);await setJson(KEY,next);return next;}\nexport async function upsertInstagramPreparationCandidate(result){const current=(await getJson(KEY))||{};const rows=Array.isArray(current.candidateResults)?[...current.candidateResults]:[];const idx=rows.findIndex(x=>String(x?.index)===String(result?.index));if(idx>=0)rows[idx]={...rows[idx],...result};else rows.push(result);return setInstagramPreparationProgress({...current,candidateResults:rows.slice(-MAX_RESULTS)});}\nexport function normalizeStorageError(error){const raw=String(error?.message||error||'').slice(0,500);const low=raw.toLowerCase();if(low.includes('this_store_has_been_suspended')||low.includes('store_has_been_suspended'))return{code:'VERCEL_BLOB_STORE_SUSPENDED',safeMessage:'Vercel Blob store sedang suspended.'};if(low.includes('token')||low.includes('authorization'))return{code:'STORAGE_AUTH_ERROR',safeMessage:'Penyimpanan Social Card tidak dapat diautentikasi.'};return{code:'CARD_PERSIST_FAILED',safeMessage:raw};}\nexport async function finishInstagramPreparationProgress(status,extra={}){const current=(await getJson(KEY))||{};return setInstagramPreparationProgress({...current,status,active:false,completedAt:new Date().toISOString(),...extra});}\nexport {KEY as INSTAGRAM_PREPARATION_PROGRESS_KEY,MAX_RESULTS};\n"""
          edit('lib/instagram-preparation-progress.js',progress)
          def route(s):
            s=s.replace("import {getInstagramAdminSnapshot,invalidateInstagramAdminSnapshot} from '../../../../../lib/instagram-admin-snapshot.js';","import {invalidateInstagramAdminSnapshot} from '../../../../../lib/instagram-admin-snapshot.js';")
            s=s.replace("async function state(){const [snapshot,progress]=await Promise.all([getInstagramAdminSnapshot(),getInstagramPreparationProgress()]);","async function state(){const progress=await getInstagramPreparationProgress({recoverStale:true});")
            return s
          edit('app/api/admin/instagram/prepare-now/route.js',route)
          def publisher(s):
            s=s.replace("import {buildCarouselImageUrls} from '../lib/social-carousel.js';","import {buildCarouselImageUrls,INSTAGRAM_CAROUSEL_MAX_ITEMS} from '../lib/social-carousel.js';").replace("if(!urls.length||urls.length>2)throw","if(!urls.length||urls.length>INSTAGRAM_CAROUSEL_MAX_ITEMS)throw")
            return s
          edit('worker/social-run.js',publisher)
          Path('worker/instagram-preparation-resilience-regression.js').write_text("""import fs from 'node:fs';import assert from 'node:assert/strict';import {buildInstagramSlides} from '../lib/social-visual.js';import {INSTAGRAM_CAROUSEL_MAX_ITEMS} from '../lib/social-carousel.js';import {INSTAGRAM_CAROUSEL_MAX_SLIDES} from '../lib/instagram-carousel-contract.js';import {PREPARATION_STALE_THRESHOLD_MS,preparationHeartbeatFresh} from '../lib/instagram-preparation-progress.js';const prep=fs.readFileSync(new URL('../lib/social-preparation.js',import.meta.url),'utf8');const admin=fs.readFileSync(new URL('../lib/instagram-preparation-admin-live.js',import.meta.url),'utf8');const route=fs.readFileSync(new URL('../app/api/admin/instagram/prepare-now/route.js',import.meta.url),'utf8');const publisher=fs.readFileSync(new URL('./social-run.js',import.meta.url),'utf8');assert.equal(INSTAGRAM_CAROUSEL_MAX_SLIDES,2);assert.equal(INSTAGRAM_CAROUSEL_MAX_ITEMS,2);const short={id:'s',title:'Berita singkat',category:'Nasional',content:'Pemerintah mengumumkan kebijakan baru hari ini.',sitePublishedAt:'2026-08-25T00:00:00Z',sourceUrl:'https://example.com/a'};const long={...short,id:'l',content:Array.from({length:10},(_,i)=>`Paragraf panjang ke-${i+1} menjelaskan kronologi, keputusan, respons, lokasi, waktu, dan dampak kebijakan pemerintah secara rinci.`).join('\\n\\n')};for(const a of [short,long]){const slides=buildInstagramSlides(a);assert.ok(slides.length>=1&&slides.length<=2)}assert.match(prep,/INSTAGRAM_CAROUSEL_MAX_SLIDES/);assert.doesNotMatch(prep,/sourceUrls\\.length>3/);assert.match(admin,/PREPARATION_CANDIDATE_TIMEOUT/);assert.match(admin,/stageDurationsMs/);assert.match(admin,/byId\\.get\\(String\\(item\\?\\.article\\?\\.id\\)\\)\\|\\|item\\.article/);assert.doesNotMatch(admin,/deterministicCaption\\(/);assert.match(route,/recoverStale:true/);assert.doesNotMatch(route,/getInstagramAdminSnapshot\\(/);assert.match(publisher,/INSTAGRAM_CAROUSEL_MAX_ITEMS/);const now=Date.now();assert.equal(preparationHeartbeatFresh({status:'PREPARING',heartbeatAt:new Date(now-1000).toISOString(),expiresAt:now+60000},now),true);assert.equal(preparationHeartbeatFresh({status:'PREPARING',heartbeatAt:new Date(now-PREPARATION_STALE_THRESHOLD_MS-1000).toISOString(),expiresAt:now+60000},now),false);console.log('instagram preparation resilience PASS');\n"")
          pkg=root/'package.json';txt=pkg.read_text();txt=txt.replace('node worker/instagram-caption-preparation-regression.js &&','node worker/instagram-caption-preparation-regression.js && node worker/instagram-preparation-resilience-regression.js &&',1);pkg.write_text(txt)
          PY
      - name: Test
        run: npm ci && npm test
      - name: Commit source repair
        run: |
          git config user.name 'projectdaaw-bot'
          git config user.email 'projectdaaw-bot@users.noreply.github.com'
          git add app lib worker package.json
          git diff --cached --check
          git commit -m '[instagram-repair] fix bounded preparation lifecycle and carousel contract'
          git push origin feature/auto-news-mvp
